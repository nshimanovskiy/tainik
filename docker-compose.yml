# Тайник на VPS: только сервер. Порт открыт лишь на 127.0.0.1 —
# снаружи к нему ходит ваш nginx (см. deploy/setup.sh и DEPLOY.md).
#
# Звонки: TURN-сервер coturn включается скриптом deploy/setup-calls.sh
# (он пишет в .env COMPOSE_PROFILES=calls и учётные данные TURN).
# Имя проекта фиксировано: от него зависят имена томов с данными
name: e2e-messenger

services:
  tainik:
    build: .
    image: tainik-server:latest
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      QUEUE_TTL_DAYS: ${QUEUE_TTL_DAYS:-30}
      MAX_CONN_PER_IP: ${MAX_CONN_PER_IP:-100}
      DOMAIN: ${DOMAIN:-}
      # Web Push (уведомления в браузер при закрытой вкладке): контакт для push-сервисов
      ACME_EMAIL: ${ACME_EMAIL:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      WEB_PUSH: ${WEB_PUSH:-1}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURNS_PORT: ${TURNS_PORT:-0}
      STUN_FALLBACK: ${STUN_FALLBACK-stun:stun.l.google.com:19302}
      # Панель администратора (пользователи, статус, IP текущих подключений). Без пароля выключена.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PATH: ${ADMIN_PATH:-/adminadminadmin}
      # Загрузки с сайта и самообновление приложений: релизы этого репозитория GitHub
      # ретранслируются через ваш сервер. Пусто — выключено. Токен — только для приватного репозитория.
      RELEASES_REPO: ${RELEASES_REPO-nshimanovskiy/tainik}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Вложения (фото, видео, файлы — зашифрованы на устройстве): лимит файла и всего хранилища
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_STORAGE_GB: ${MAX_STORAGE_GB:-20}
      # Подписка «Тайник Премиум» с оплатой криптовалютой через xRocket Pay. Без токена — выключена.
      XROCKET_PAY_TOKEN: ${XROCKET_PAY_TOKEN:-}
      XROCKET_WEBHOOK_SECRET: ${XROCKET_WEBHOOK_SECRET:-}
      XROCKET_TESTNET: ${XROCKET_TESTNET:-0}
      PREMIUM_PLANS: ${PREMIUM_PLANS:-30:3}
      PREMIUM_CURRENCY: ${PREMIUM_CURRENCY:-USDT}
      PREMIUM_PAY_CURRENCIES: ${PREMIUM_PAY_CURRENCIES-GRAM,TRX}
    ports:
      - "127.0.0.1:${TAINIK_PORT:-8787}:8080"
    volumes:
      - tainik-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # TURN-сервер для звонков из сетей, где прямое соединение невозможно (NAT).
  # Пересылает только зашифрованный медиапоток (DTLS-SRTP) — прослушать звонок не может.
  coturn:
    image: coturn/coturn:latest
    profiles: [calls]
    restart: unless-stopped
    network_mode: host # тысячи UDP-портов через проброс Docker работают плохо
    # Свои параметры вместо стандартных (журнал в stdout и автоопределение IP)
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro
    tmpfs:
      - /var/lib/coturn
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  tainik-data:
