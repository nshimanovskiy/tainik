name: stt-probe
on:
  push:
    branches: [stt-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          exec > probe.txt 2>&1
          set -x
          mkdir -p /tmp/o && cd /tmp/o && npm pack onnxruntime-web@1.31.0-dev.20260914-8d85527a0 && tar xzf *.tgz && ls package && ls -la package/dist | grep -v '\.map$'
          cd $GITHUB_WORKSPACE
          node scripts/fetch-stt.mjs out --print-hashes || true
          du -ah out | sort -h | tail -30
      - run: |
          exec >> probe.txt 2>&1
          set -x
          git config user.name probe; git config user.email probe@example.com; git config http.postBuffer 524288000
          git checkout -b o
          git add -f out/v1/runtime out/v1/models/whisper-base/*.json; git commit -qm "p1"; git push --force origin o:stt-probe-out || true
          git add -f out/v1/models/whisper-base/onnx/encoder_model_quantized.onnx; git commit -qm "p2"; git push origin o:stt-probe-out || true
          git add -f out/v1/models/whisper-base/onnx/decoder_model_merged_quantized.onnx; git commit -qm "p3"; git push origin o:stt-probe-out || true
          git checkout -b l HEAD~3 -q; git add -f probe.txt; git commit -qm log; git push --force origin l:stt-probe-log
