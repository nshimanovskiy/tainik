name: stt-probe
on:
  push:
    branches: [stt-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          exec > probe.txt 2>&1
          set -x
          mkdir -p /tmp/o && cd /tmp/o && npm pack onnxruntime-web@1.31.0-dev.20260914-8d85527a0 && tar xzf *.tgz && ls -la package/dist | grep -v '\.map$'
          cd $GITHUB_WORKSPACE
          node scripts/fetch-stt.mjs out --print-hashes || true
          du -ah out | sort -h | tail -30
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git checkout -b o
          git add -f probe.txt; git commit -qm "probe log"; git push --force origin o:stt-probe-log || true
          git add -f out; git commit -qm "probe files"; git push --force origin o:stt-probe-out || true
