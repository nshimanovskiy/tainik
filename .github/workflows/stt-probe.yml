name: stt-probe
on:
  push:
    branches: [stt-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          set -x
          npm view @huggingface/transformers versions --json | tail -30
          npm view @huggingface/transformers dist-tags
          V=$(npm view @huggingface/transformers dist-tags.latest)
          mkdir p && cd p && npm pack @huggingface/transformers@$V && tar xzf *.tgz && ls -la package/dist && cat package/package.json | head -80
          npm view onnxruntime-web dist-tags
          grep -o 'ort-wasm[a-z.-]*' package/dist/transformers.web.js 2>/dev/null | sort | uniq -c || true
          grep -o 'onnxruntime-web[^"]*' package/dist/transformers.web.js | sort | uniq -c | head || true
          grep -o 'jsdelivr[^"`]*' package/dist/*.js | sort | uniq -c | head || true
      - run: |
          mkdir -p m && cd m
          for f in config.json generation_config.json preprocessor_config.json tokenizer.json tokenizer_config.json; do curl -fsSL -o $f https://huggingface.co/onnx-community/whisper-base/resolve/main/$f; done
          curl -fsSL https://huggingface.co/api/models/onnx-community/whisper-base/tree/main/onnx | python3 -c "import json,sys; [print(x['path'], x.get('size'), x.get('lfs',{}).get('oid')) for x in json.load(sys.stdin)]"
          curl -fsSL https://huggingface.co/api/models/onnx-community/whisper-small/tree/main/onnx | python3 -c "import json,sys; [print(x['path'], x.get('size')) for x in json.load(sys.stdin)]"
          curl -fsSL https://huggingface.co/api/models/onnx-community/whisper-tiny/tree/main/onnx | python3 -c "import json,sys; [print(x['path'], x.get('size')) for x in json.load(sys.stdin)]"
          sha256sum *
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: p/package/dist }
