name: stt-probe
on:
  push:
    branches: [stt-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          exec > probe.txt 2>&1
          set -x
          mkdir -p /tmp/o && cd /tmp/o && npm pack onnxruntime-web@1.31.0-dev.20260914-8d85527a0 && tar xzf *.tgz && ls package && ls -la package/dist | grep -v '\.map$'
          cd $GITHUB_WORKSPACE
          node scripts/fetch-stt.mjs out --print-hashes || true
          du -ah out | sort -h | tail -30
      - run: |
          exec >> probe.txt 2>&1
          set -x
          git config user.name probe; git config user.email probe@example.com; git config http.postBuffer 524288000
          git checkout -b o
          tar czf stt.tgz out && split -b 45m stt.tgz stt.part. && ls -la stt.part.*
          for f in stt.part.*; do git add -f $f; git commit -qm $f; git push origin o:stt-probe-out --force || true; done
          git checkout -q -b l HEAD~$(ls stt.part.* | wc -l); git add -f probe.txt; git commit -qm log; git push --force origin l:stt-probe-log
