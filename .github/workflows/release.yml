# Выпуск приложений (десктоп и Android) на GitHub Releases.
# Запускается тегом вида v1.2.3:   git tag v0.4.0 && git push origin v0.4.0
# Можно и вручную: Actions → «Выпуск приложений» → Run workflow (указав версию).
# APK подписывается ключом из секретов ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
# (см. RELEASING.md); без них — отладочным ключом с предупреждением.
name: Выпуск приложений

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без «v», например 0.4.0'
        required: true
      draft:
        description: 'Черновик (опубликовать вручную после проверки)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Адрес сервера по умолчанию в приложении. Переопределяется переменной
  # репозитория TAINIK_SERVER (Settings → Secrets and variables → Actions → Variables).
  TAINIK_SERVER: ${{ vars.TAINIK_SERVER || 'chat.sdsds.top' }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"; V="${V#v}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Неверная версия: $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    needs: [meta, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run set-version -- "${{ needs.meta.outputs.version }}"
      - run: npm run prepare-web
      - name: Сборка
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Без сертификатов сборка не подписывается (см. RELEASING.md)
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  android:
    needs: [meta, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tainik.jks"
            echo "TAINIK_KEYSTORE=$RUNNER_TEMP/tainik.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=APK подписан отладочным ключом::Добавьте секреты ANDROID_KEYSTORE_BASE64 и ANDROID_KEYSTORE_PASSWORD (RELEASING.md). Такой APK нельзя будет обновить версией с настоящим ключом — только удалить и поставить заново."
          fi
      - name: Сборка APK
        run: android/scripts/ci-gradle.sh assembleRelease -Ptainik.version=${{ needs.meta.outputs.version }}
        env:
          TAINIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAINIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAINIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Имя файла
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/release/app-release.apk "android/dist/Tainik-${{ needs.meta.outputs.version }}-android.apk"
          rm -f "$RUNNER_TEMP/tainik.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: android/dist/*.apk
          if-no-files-found: error

  release:
    needs: [meta, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Контрольные суммы
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Описание выпуска
        run: |
          V="${{ needs.meta.outputs.version }}"
          {
            echo "## Тайник $V"
            echo
            if [ -f CHANGELOG.md ]; then
              awk -v v="$V" '$0 ~ "^## " {p = index($0, v) > 0; next} p' CHANGELOG.md
              echo
            fi
            cat .github/release-notes.md
            echo
            echo "Сервер по умолчанию: \`${TAINIK_SERVER}\` (можно изменить при первом входе)."
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: Тайник ${{ needs.meta.outputs.version }}
          body_path: notes.md
          # публикуется сразу; черновик — только если при ручном запуске отмечено «Черновик»
          draft: ${{ inputs.draft == true }}
          make_latest: ${{ inputs.draft != true }}
          files: out/*
