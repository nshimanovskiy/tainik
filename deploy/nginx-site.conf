# Шаблон сайта Тайника для nginx. deploy/setup.sh подставляет домен и порт.
# Журнал запросов отключён: IP и время визитов не копятся.

map $http_upgrade $tainik_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __DOMAIN__;

    access_log off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        # WebSocket (/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tainik_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        proxy_set_header Host $host;
        # Перезаписываем, а не дополняем: клиент не сможет подделать свой IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
